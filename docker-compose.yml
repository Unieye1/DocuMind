
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: documind-backend
    ports:
      - "3001:3000"
    env_file:
      - ./Backend/.env.docker
    depends_on:
      db:
       condition: service_healthy

  db:
    image: pgvector/pgvector:pg18
    container_name: documind-db
    env_file:
      - ./Backend/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: documind-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0    

volumes:
  postgres_data:




